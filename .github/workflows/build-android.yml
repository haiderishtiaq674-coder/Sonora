name: Build Sonora Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*native*.zip' | head -n 1)
          mkdir -p /tmp/sonora
          unzip -q "$ZIP" -d /tmp/sonora
          ROOT=$(find /tmp/sonora -name settings.gradle.kts -printf '%h\n' | head -n 1)
          cp -a "$ROOT"/. .

      - name: Fix Android build configuration
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.activity:activity-ktx:1.9.3")
          }
          EOF

      - name: Fix permission callback
        run: |
          sed -i 's/permissions: Array<out String>/permissions: Array<String>/' app/src/main/java/com/sonora/player/MainActivity.kt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
